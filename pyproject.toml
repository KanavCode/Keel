[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-harness"
version = "0.1.0"
description = "A reliability harness that makes small open-weight models dependable at structured output and tool use."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
graph = ["graphifyy>=0.9"]  # builds the code graph used by `keel plan`

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.setuptools.package-data]
keel = ["bench/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
